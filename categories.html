<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Browse CartVanta shopping categories and discover destination-available products."><title>All shopping categories | CartVanta</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#171717;font:14px/1.6 Arial,sans-serif}a{color:inherit;text-decoration:none}.top{background:#111;color:#fff;padding:18px 5vw}.logo{font-size:24px;font-weight:900;letter-spacing:-1px}.wrap{max-width:1200px;margin:auto;padding:55px 5vw 90px}.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#777}h1{font-size:clamp(42px,7vw,76px);letter-spacing:-.07em;line-height:.95;margin:15px 0}.intro{color:#777;max-width:650px}.search{width:100%;max-width:500px;margin:28px 0;padding:15px;border:1px solid #ddd;background:#fff}.group{margin-top:35px}.group h2{font-size:24px;letter-spacing:-.04em}.items{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.item{display:block;background:#fff;border:1px solid #e8e6e0;padding:16px;min-height:80px;transition:.2s}.item:hover{border-color:#171717;transform:translateY(-2px)}.item b{font-size:12px}.item small{display:block;color:#888;font-size:10px;margin-top:6px}.status{padding:18px;background:#fff;border:1px solid #e8e6e0;color:#777}@media(max-width:760px){.items{grid-template-columns:repeat(2,1fr)}.wrap{padding:38px 17px 70px}}@media(max-width:420px){.items{grid-template-columns:1fr 1fr;gap:7px}.item{padding:12px}}</style></head><body><header class="top"><a class="logo" href="/">cartvanta.</a></header><main class="wrap"><div class="eyebrow">Explore the catalogue</div><h1>Find your<br>category.</h1><p class="intro">Browse supplier categories from the live CJ catalogue. Products are filtered by your selected destination and checked for warehouse inventory before they appear in the shop.</p><input id="search" class="search" placeholder="Search categories…" aria-label="Search categories"><div id="status" class="status">Loading live categories…</div><div id="groups"></div></main><script>
const $=id=>document.getElementById(id);let all=[];
function render(){const q=$('search').value.trim().toLowerCase();const rows=all.filter(x=>(x.name+' '+x.parent+' '+x.department).toLowerCase().includes(q));const grouped={};rows.forEach(x=>(grouped[x.department]??=[]).push(x));$('groups').innerHTML=Object.entries(grouped).map(([name,list])=>'<section class="group"><h2>'+name+'</h2><div class="items">'+list.map(x=>'<a class="item" href="/?categoryId='+encodeURIComponent(x.id)+'#shop"><b>'+x.name+'</b><small>'+x.parent+' · View destination products ↗</small></a>').join('')+'</div></section>').join('')||'<div class="status">No categories match that search.</div>';$('status').textContent=rows.length+' live supplier categories shown.'}
async function init(){try{const r=await fetch('/api/cj-categories');const d=await r.json();if(!r.ok)throw new Error(d.error||'Category service unavailable');all=d.categories||[];render()}catch(e){$('status').textContent=e.message+' Try again later or contact support.'}}
$('search').addEventListener('input',render);init();
</script><script src="/analytics.js"></script></body></html>
