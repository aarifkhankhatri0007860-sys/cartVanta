<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Browse CartVanta shopping categories and discover destination-available products."><title>All shopping categories | CartVanta</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#171717;font:14px/1.6 Arial,sans-serif}a{color:inherit;text-decoration:none}.top{background:#111;color:#fff;padding:18px 5vw}.logo{font-size:24px;font-weight:900;letter-spacing:-1px}.wrap{max-width:1200px;margin:auto;padding:55px 5vw 90px}.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#777}h1{font-size:clamp(42px,7vw,76px);letter-spacing:-.07em;line-height:.95;margin:15px 0}.intro{color:#777;max-width:650px}.search{width:100%;max-width:500px;margin:28px 0;padding:15px;border:1px solid #ddd;background:#fff}.group{margin-top:35px}.group h2{font-size:24px;letter-spacing:-.04em}.items{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.item{display:block;background:#fff;border:1px solid #e8e6e0;padding:16px;min-height:80px;transition:.2s}.item:hover{border-color:#171717;transform:translateY(-2px)}.item b{font-size:12px}.item small{display:block;color:#888;font-size:10px;margin-top:6px}.status{padding:18px;background:#fff;border:1px solid #e8e6e0;color:#777}@media(max-width:760px){.items{grid-template-columns:repeat(2,1fr)}.wrap{padding:38px 17px 70px}}@media(max-width:420px){.items{grid-template-columns:1fr 1fr;gap:7px}.item{padding:12px}}</style></head><body><header class="top"><a class="logo" href="/">cartvanta.</a></header><main class="wrap"><div class="eyebrow">Explore the catalogue</div><h1>Find your<br>category.</h1><p class="intro">Browse categories maintained by CartVanta. Every published item is managed from our own inventory.</p><input id="search" class="search" placeholder="Search categories…" aria-label="Search categories"><div id="status" class="status">Loading live categories…</div><div id="groups"></div></main><script type="module">
import { API_BASE } from "./database-config.js";
const $=id=>document.getElementById(id);let all=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){const q=$("search").value.trim().toLowerCase(),rows=all.filter(x=>(x.name||"").toLowerCase().includes(q));$("groups").innerHTML=rows.length?'<section class="group"><div class="items">'+rows.map(x=>'<a class="item" href="/#shop"><b>'+esc(x.name)+'</b><small>Browse published products ↗</small></a>').join("")+'</div></section>':'<div class="status">No categories found.</div>';$("status").textContent=rows.length+" active CartVanta categories."}
async function init(){try{const r=await fetch(API_BASE+"/api/categories");if(!r.ok)throw new Error("API returned "+r.status);all=await r.json();render()}catch(e){$("status").textContent="CartVanta category service could not connect: "+e.message}}
$("search").addEventListener("input",render);init();
</script><script src="/analytics.js"></script></body></html>
