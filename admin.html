<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>CartVanta Admin & CRM</title><style>
:root{--bg:#f4f6fa;--ink:#172033;--muted:#758097;--line:#e4e8f0;--blue:#315eea;--nav:#111b2d;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:238px;background:var(--nav);color:white;padding:24px 16px;display:flex;flex-direction:column;z-index:5}.brand{font-size:23px;font-weight:850;letter-spacing:-1.3px;padding:4px 12px 30px}.brand span{color:#8da7ff}.side-label{font-size:10px;color:#8290a8;text-transform:uppercase;letter-spacing:.16em;padding:12px}.navbtn{width:100%;text-align:left;color:#c5cede;background:transparent;border:0;padding:12px;border-radius:9px;margin:2px 0;font-size:13px}.navbtn.active,.navbtn:hover{background:#263653;color:white}.side-foot{margin-top:auto;color:#8290a8;font-size:11px;padding:12px}.main{margin-left:238px;padding:26px clamp(16px,3vw,42px);max-width:1600px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}.top h1{font-size:25px;letter-spacing:-.7px;margin:0}.top p{color:var(--muted);margin:5px 0}.userbox{display:flex;align-items:center;gap:10px}.avatar{width:35px;height:35px;border-radius:50%;background:#dfe7ff;color:#315eea;display:grid;place-items:center;font-weight:800}.btn{border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:white;font-weight:650}.btn.secondary{background:#edf1ff;color:#315eea}.btn.dark{background:#172033}.btn.danger{background:#fff0f0;color:#bf3434}.btn:disabled{opacity:.5;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:0 3px 14px #17203305}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin:8px 0 2px;letter-spacing:-1px}.stat em{font-style:normal;color:#27946b;font-size:11px}.panel{margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel h2{font-size:16px;margin:0}.muted{color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid var(--line);background:white;color:#657087;padding:9px 13px;border-radius:8px}.tab.active{background:#eaf0ff;color:#315eea;border-color:#cfdaff}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.field{width:100%;border:1px solid #dce2ec;border-radius:8px;padding:11px;background:white;color:var(--ink);outline:none}.field:focus{border-color:#7d99ff;box-shadow:0 0 0 3px #315eea14}.toolbar .field{max-width:280px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f5;font-size:12px}th{color:#7b8599;font-weight:650;background:#fafbfe}td{color:#344056}.thumb{width:40px;height:40px;object-fit:cover;border-radius:7px;background:#eef0f4;vertical-align:middle;margin-right:9px}.pill{display:inline-block;border-radius:30px;padding:5px 9px;font-size:10px;background:#edf1f7;color:#637087}.pill.green{background:#e8f8f0;color:#208458}.pill.orange{background:#fff3e5;color:#ad6a15}.pill.red{background:#fff0f0;color:#bd3a3a}.empty{padding:30px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.group label{display:block;font-size:11px;font-weight:700;color:#68748b;margin-bottom:6px}.group.full{grid-column:1/-1}.group textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.preview{width:76px;height:76px;object-fit:cover;border-radius:9px;background:#eef0f4}.photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.notice{padding:12px 14px;background:#eef3ff;color:#3653a4;border-radius:8px;font-size:12px;margin-bottom:16px}.error{background:#fff0f0;color:#b52f2f}.success{background:#e9f8f0;color:#20784f}.login{max-width:420px;margin:10vh auto;background:white;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 10px 40px #1720330c}.login h1{margin:0 0 6px}.login .group{margin:16px 0}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#11182788;display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}.modalbox{background:white;width:min(760px,100%);max-height:94vh;overflow:auto;border-radius:14px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{border:0;background:#f0f2f6;border-radius:50%;width:32px;height:32px;font-size:19px}@media(max-width:900px){.sidebar{width:68px;padding:16px 8px}.brand{font-size:0;padding:8px 10px 25px}.brand:after{content:'CV';font-size:18px}.side-label,.navbtn span,.side-foot{display:none}.navbtn{text-align:center;font-size:18px;padding:13px 4px}.main{margin-left:68px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.main{padding:18px 12px}.top{align-items:flex-start}.top h1{font-size:21px}.top p{font-size:11px}.cards{gap:8px}.stat{padding:13px}.stat strong{font-size:22px}.formgrid{grid-template-columns:1fr}.group.full{grid-column:auto}.toolbar .field{max-width:none;flex:1;min-width:130px}.login{margin:7vh 14px;padding:22px}}
</style></head><body>
<div id="loginView" class="login"><div class="brand" style="color:#172033;padding:0 0 18px">cart<span style="color:#315eea">vanta.</span></div><h1>Store owner access</h1><p class="muted">Private product and order management</p><div class="group"><label>Private access key</label><input id="accessKey" class="field" type="password" autocomplete="current-password" placeholder="Enter your private admin key"></div><button id="quickAccessBtn" class="btn" style="width:100%">Open my dashboard</button><div id="loginMsg" class="notice hidden" style="margin-top:14px"></div><p class="muted" style="font-size:11px;margin-top:16px">Only the store owner should use this page. Do not share your access key.</p></div>
<div id="appView" class="shell hidden"><aside class="sidebar"><div class="brand">cart<span>vanta.</span></div><div class="side-label">Workspace</div><button class="navbtn active" data-page="dashboard">▦ <span>Dashboard</span></button><button class="navbtn" data-page="products">▣ <span>Products</span></button><button class="navbtn" data-page="categories">▤ <span>Categories</span></button><button class="navbtn" data-page="orders">▧ <span>Orders & CRM</span></button><button class="navbtn" data-page="customers">♙ <span>Customers</span></button><div class="side-foot">CartVanta Admin · Secure workspace</div></aside><main class="main"><header class="top"><div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Your store at a glance</p></div><div class="userbox"><div class="avatar">CV</div><button id="logoutBtn" class="btn secondary">Sign out</button></div></header><div id="notice" class="notice hidden"></div><section id="dashboardPage"></section><section id="productsPage" class="hidden"></section><section id="categoriesPage" class="hidden"></section><section id="ordersPage" class="hidden"></section><section id="customersPage" class="hidden"></section></main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Add new</h2><button class="close" id="closeModal">×</button></div><div id="modalBody"></div></div></div><script type="module" src="/admin.js"></script></body></html>
