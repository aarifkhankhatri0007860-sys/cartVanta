<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Your bag | CartVanta</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f4;color:#171717;font:14px/1.6 Arial,sans-serif}.nav{padding:18px 5vw;border-bottom:1px solid #e8e5df;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:800;letter-spacing:-1.5px;text-decoration:none;color:#171717}.logo span{font-family:Georgia,serif;font-style:italic;font-weight:500}.wrap{max-width:1050px;margin:40px auto;padding:0 20px 70px}h1{font:600 clamp(36px,6vw,58px)/1 Georgia,serif;letter-spacing:-.05em}.muted{color:#777;font-size:12px}.item{display:grid;grid-template-columns:100px 1fr auto;gap:16px;padding:16px 0;border-bottom:1px solid #e5e1d9;align-items:center}.item img{width:100px;height:100px;object-fit:contain;background:white}.item h3{font-size:14px;margin:0 0 7px}.item input{width:65px;padding:8px;border:1px solid #ddd}.remove{border:0;background:transparent;text-decoration:underline;font-size:11px}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:start}.panel{padding:22px;background:#fff;border:1px solid #e5e1d9;margin-top:18px}.field{width:100%;padding:12px;border:1px solid #ddd;margin:6px 0 14px;border-radius:5px}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:700}.submit{width:100%;border:0;background:#171717;color:white;padding:15px;margin-top:18px;cursor:pointer}.submit:disabled{opacity:.5}.notice{padding:13px;background:#edf4e7;color:#34552d;margin:12px 0}.error{background:#fff0f0;color:#a22}.continue{display:inline-block;margin-top:20px;color:#171717;font-size:12px}@media(max-width:700px){.layout{grid-template-columns:1fr}.item{grid-template-columns:75px 1fr}.item img{width:75px;height:80px}.item>strong{grid-column:2}}
</style></head><body><header class="nav"><a class="logo" href="/">cart<span>vanta.</span></a><a href="/">Continue shopping ↗</a></header><main class="wrap"><div class="muted">CARTVANTA / YOUR BAG</div><h1>Your bag.</h1><p class="muted">Your order is created against current CartVanta inventory. Cash on Delivery is currently the only enabled payment method.</p><div class="layout"><section><div id="items"></div></section><aside><div class="panel"><h2>Delivery details</h2><form id="checkout"><label>Full name *</label><input class="field" name="customerName" required maxlength="120"><label>Mobile number *</label><input class="field" name="phone" required inputmode="tel" minlength="10" maxlength="16"><label>Email (optional)</label><input class="field" name="email" type="email" maxlength="254"><label>Full delivery address *</label><textarea class="field" name="address" required minlength="8" rows="4"></textarea><div id="summary"></div><div id="notice" class="notice" hidden></div><button class="submit" id="placeOrder" type="submit">Place COD order</button></form></div></aside></div><a class="continue" href="/#shop">← Continue shopping</a></main><script type="module">
import { API_BASE } from "./database-config.js";
const itemsEl=document.getElementById("items"),summary=document.getElementById("summary"),notice=document.getElementById("notice");let cart=[];
try{cart=JSON.parse(localStorage.getItem("cartvanta_cart")||"[]");if(!Array.isArray(cart))cart=[]}catch{cart=[]}
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>"₹"+Number(v||0).toLocaleString("en-IN");
function save(){localStorage.setItem("cartvanta_cart",JSON.stringify(cart));render()}
function render(){if(!cart.length){itemsEl.innerHTML='<div class="panel">Your bag is empty. <a href="/">Explore products</a>.</div>';summary.innerHTML="";document.getElementById("placeOrder").disabled=true;return}itemsEl.innerHTML=cart.map((x,i)=>'<article class="item"><img src="'+esc(x.image||"")+'" alt=""><div><h3>'+esc(x.name||"Product")+'</h3><div class="muted">SKU: '+esc(x.sku||"—")+'</div><label class="muted">Qty <input type="number" min="1" max="20" value="'+Math.max(1,Math.min(20,Number(x.qty)||1))+'" data-qty="'+i+'"></label><br><button class="remove" data-remove="'+i+'">Remove</button></div><strong>'+money(Number(x.price||0)*Math.max(1,Number(x.qty)||1))+'</strong></article>').join("");const subtotal=cart.reduce((s,x)=>s+Number(x.price||0)*Math.max(1,Number(x.qty)||1),0);summary.innerHTML='<div class="total"><span>Subtotal</span><span>'+money(subtotal)+'</span></div><p class="muted">Shipping charges: as displayed/confirmed by CartVanta before dispatch. No online payment is collected on this page.</p>'}
itemsEl.addEventListener("change",e=>{const i=Number(e.target.dataset.qty);if(Number.isInteger(i)&&cart[i]){cart[i].qty=Math.max(1,Math.min(20,Number(e.target.value)||1));save()}});
itemsEl.addEventListener("click",e=>{const b=e.target.closest("[data-remove]");if(b){cart.splice(Number(b.dataset.remove),1);save()}});
document.getElementById("checkout").addEventListener("submit",async e=>{e.preventDefault();if(!cart.length)return;const btn=document.getElementById("placeOrder");btn.disabled=true;btn.textContent="Submitting order…";notice.hidden=true;try{const fd=new FormData(e.currentTarget);const payload={customerName:fd.get("customerName"),phone:fd.get("phone"),email:fd.get("email"),address:fd.get("address"),paymentMethod:"cod",items:cart.map(x=>({productId:x.id,quantity:Number(x.qty)}))};const r=await fetch(API_BASE+"/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error||"Order could not be placed");localStorage.removeItem("cartvanta_cart");cart=[];itemsEl.innerHTML='<div class="panel"><h2>Thank you. Your order has been placed.</h2><p>Order number: <strong>'+esc(d.orderNumber)+'</strong></p><p>Order total: <strong>'+money(d.total)+'</strong></p><p>CartVanta team will contact you to confirm delivery details.</p></div>';summary.innerHTML="";e.currentTarget.reset();notice.hidden=false;notice.textContent="Order successfully saved in CartVanta database."}catch(err){notice.hidden=false;notice.className="notice error";notice.textContent=err.message;btn.disabled=false;btn.textContent="Place COD order"}});
render();
</script></body></html>
