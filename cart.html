<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Your bag | CartVanta"><style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f4;color:#171717;font:14px/1.6 Arial,sans-serif}.nav{padding:18px 5vw;border-bottom:1px solid #e8e5df;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:800;letter-spacing:-1.5px;text-decoration:none;color:#171717}.logo span{font-family:Georgia,serif;font-style:italic;font-weight:500}.wrap{max-width:1050px;margin:40px auto;padding:0 20px 70px}h1{font:600 clamp(36px,6vw,58px)/1 Georgia,serif;letter-spacing:-.05em}.muted{color:#777;font-size:12px}.item{display:grid;grid-template-columns:110px 1fr auto;gap:18px;padding:18px 0;border-bottom:1px solid #e5e1d9;align-items:center}.item img{width:110px;height:110px;object-fit:contain;background:white}.item h3{font-size:14px;margin:0 0 7px}.item input{width:65px;padding:8px;border:1px solid #ddd}.remove{border:0;background:transparent;text-decoration:underline;font-size:11px}.summary{margin:25px 0 0 auto;max-width:360px;padding:22px;background:white;border:1px solid #e5e1d9}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:700}.disabled{width:100%;border:0;background:#d9d6ce;color:#666;padding:15px;margin-top:18px;cursor:not-allowed}.continue{display:inline-block;margin-top:20px;color:#171717;font-size:12px}@media(max-width:550px){.item{grid-template-columns:80px 1fr}.item img{width:80px;height:90px}.item>strong{grid-column:2}.summary{max-width:none}}
</style></head><body><header class="nav"><a class="logo" href="/">cart<span>vanta.</span></a><a href="/#shop">Continue shopping ↗</a></header><main class="wrap"><div class="muted">CARTVANTA / YOUR BAG</div><h1>Your bag.</h1><p class="muted">Review selected items. Prices shown here are supplier prices only, not final customer prices.</p><div id="items"></div><div id="summary"></div><a class="continue" href="/#shop">← Continue shopping</a></main><script>
const itemsEl=document.getElementById('items'),summary=document.getElementById('summary');let cart=[];try{cart=JSON.parse(localStorage.getItem('cartvanta_cart')||'[]');if(!Array.isArray(cart))cart=[]}catch(e){cart=[]}
function save(){localStorage.setItem('cartvanta_cart',JSON.stringify(cart));render()}
function render(){if(!cart.length){itemsEl.innerHTML='<div style="padding:30px;background:white">Your bag is empty. <a href="/#shop">Explore the catalogue</a>.</div>';summary.innerHTML='';return}itemsEl.innerHTML=cart.map((x,i)=>'<article class="item"><img src="'+String(x.image||'').replace(/["<>]/g,'')+'" alt=""><div><h3>'+String(x.name||'Product').replace(/[<>]/g,'')+'</h3><div class="muted">SKU: '+String(x.sku||'').replace(/[<>]/g,'')+'</div><label class="muted">Qty <input type="number" min="1" max="99" value="'+Math.max(1,Math.min(99,Number(x.qty)||1))+'" data-qty="'+i+'"></label><br><button class="remove" data-remove="'+i+'">Remove</button></div><strong>$'+(Number(x.price||0)*Math.max(1,Number(x.qty)||1)).toFixed(2)+'</strong></article>').join('');const subtotal=cart.reduce((s,x)=>s+Number(x.price||0)*Math.max(1,Number(x.qty)||1),0);summary.innerHTML='<div class="summary"><div class="total"><span>Supplier subtotal</span><span>$'+subtotal.toFixed(2)+'</span></div><p class="muted">Shipping, import duties, taxes and retail pricing are not calculated. We are not accepting orders or payments yet.</p><button class="disabled" disabled>Checkout unavailable — verification required</button></div>'}
itemsEl.addEventListener('change',e=>{const i=Number(e.target.dataset.qty);if(Number.isInteger(i)&&cart[i]){cart[i].qty=Math.max(1,Math.min(99,Number(e.target.value)||1));save()}});itemsEl.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b){cart.splice(Number(b.dataset.remove),1);save()}});render();
</script></body></html>
